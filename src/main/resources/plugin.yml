name: atrain
version: '${version}'
main: com.avery.atrain.AtrainPlugin
api-version: '1.21'
softdepend: [BlueMap]
authors: [Avery]
description: 金磚站點資訊顯示（零指令、蹲下右鍵操作）

commands:
  train:
    description: 火車系統主指令
    aliases: [tr, 火車]
    usage: /train [gui|reload|...]
  lang:
    description: 切換語言
    usage: /lang <語言代碼>

permissions:
  atrain.admin:
    description: 管理員全權限（含方塊保護、reload、刪除站點、管理員備註）
    default: op
    children:
      atrain.gui: true
      atrain.station.edit: true
      atrain.speed.edit: true
      atrain.cart.spawn: true
      atrain.block.break: true
      atrain.user: true
  atrain.user:
    description: 使用站點導覽、路線規劃與搭乘指引（/train、/tr）
    default: true
  atrain.gui:
    description: 開啟管理介面（/train gui、站點/路線列表）
    default: op
  atrain.station.edit:
    description: 蹲下右鍵編輯金磚站點、建立站點
    default: op
  atrain.speed.edit:
    description: 蹲下右鍵編輯軌下調速鑽石塊
    default: op
  atrain.cart.spawn:
    description: 在站點右鍵召喚原版礦車（非蹲下）
    default: op
  atrain.block.break:
    description: 破壞已註冊的金磚站點方塊與調速鑽石塊
    default: op
