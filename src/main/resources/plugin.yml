name: atrain
version: '${version}'
main: com.avery.atrain.AtrainPlugin
api-version: '1.21'
authors: [Avery]
description: 金磚站點資訊顯示（零指令、蹲下右鍵操作）

commands:
  train:
    description: 火車系統主指令
    aliases: [tr, 火車]
    usage: /train [gui|reload|...]
  lang:
    description: 切換語言
    usage: /lang <語言代碼>

permissions:
  atrain.admin:
    description: 管理員權限
    default: op
    children:
      atrain.gui: true
      atrain.use: true
      atrain.create: true
      atrain.station.edit: true
      atrain.cart.spawn: true
  atrain.gui:
    description: 開啟管理介面
    default: true
  atrain.use:
    description: 已保留供相容，目前無特殊限制
    default: true
  atrain.create:
    description: 已保留供相容
    default: op
  atrain.station.edit:
    description: 蹲下右鍵編輯金磚站點
    default: true
  atrain.cart.spawn:
    description: 在站點右鍵召喚原版礦車
    default: true
