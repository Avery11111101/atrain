name: atrain
version: '${version}'
main: com.avery.atrain.AtrainPlugin
api-version: '1.21'
authors: [Avery]
description: 虛擬路線礦車系統 - 金磚站點、圖形介面、多語言

commands:
  train:
    description: 火車系統主指令
    aliases: [tr, 火車]
    usage: /train [gui|reload|...]
  lang:
    description: 切換語言
    usage: /lang <語言代碼>

permissions:
  atrain.admin:
    description: 管理員權限
    default: op
    children:
      atrain.gui: true
      atrain.use: true
      atrain.create: true
  atrain.gui:
    description: 開啟管理介面
    default: true
  atrain.use:
    description: 搭乘礦車
    default: true
  atrain.create:
    description: 建立路線與管理站點
    default: op
  atrain.station.edit:
    description: 蹲下右鍵編輯金磚站點
    default: op
