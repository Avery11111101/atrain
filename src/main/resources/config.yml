config-version: 1

settings:
  cart_speed: 0.35
  cart_spawn_delay: 40
  cart_departure_delay: 80
  cart_despawn_delay: 20  # 空礦車刪除延遲（tick，20 = 1 秒）
  default_dwell_time: 80
  auto_stop: false
  station_display: true
  cart_spawn: true
  cart_spawn_auto_mount: true
  cart_spawn_radius: 2.5
  cart_spawn_cooldown: 40

movement:
  # 移動模式：false = 原版軌道物理（只調 maxSpeed，適合動力軌上坡）
  # true  = 路徑導引糾偏（複雜路網防飄線，但可能與上坡動力軌衝突）
  path_guidance: false
  guidance_strength: 0.65
  guidance_interval_ticks: 2
  stall_recovery: false
  stall_recovery_ticks: 10
  min_cruise_speed: 0.06
  # 前方有阻擋時停止推力
  obstruction_check: true
  obstruction_distance: 1.2

display:
  title_enabled: true
  actionbar_enabled: true
  scoreboard_enabled: true

route_recording:
  sample_distance: 2.0
  auto_snap_rail: true

default_language: zh_TW

# 懸浮軌道（參考 TC-HangRail，預設開啟）
hang_rail:
  enabled: false
  types:
    - block: IRON_BARS
      offset: -2
    # 範例：在紅色羊毛上方懸浮
    # - block: RED_WOOL
    #   offset: 1
