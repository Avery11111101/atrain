# ── 教學分類 ──
tutorial.quickstart.title: "§a§l快速開始"
tutorial.quickstart.summary:
  - "§7玩家搭車入門"
  - "§7零指令看站名、召車上車"
tutorial.quickstart.steps:
  - "§f看站點資訊\n§7站在 §6金磚§7 上（不是鐵軌），動作列顯示上一站/本站/下一站"
  - "§f召喚列車\n§7在站點 §e鐵軌 §7上 §e一般右鍵§7（§c不要蹲下§7）"
  - "§f自動上車\n§7預設召車後會自動坐上礦車"
  - "§f站點導引\n§7站點已加入路線時：停靠倒數 → 自動發車 → 抵達下一站"
  - "§f下車\n§7按 §eShift §7下車，空車會自動消失"
  - "§f語言\n§7/lang zh_TW 切換介面語言"

tutorial.stop.title: "§6§l建立站點"
tutorial.stop.summary:
  - "§7金磚 + 鐵軌虛擬站點"
  - "§7無需選區或錄製軌道"
tutorial.stop.steps:
  - "§f金磚月台\n§7在金磚上方鋪任意種類鐵軌即為停靠點"
  - "§f多顆金磚\n§7相鄰金磚會自動合併為同一個站點"
  - "§f蹲下右鍵編輯\n§7需 atrain.station.edit 權限（預設 OP）"
  - "§f停留時間\n§7在 GUI 設定列車到站後停留多久"
  - "§f調速方塊\n§7鐵軌正下方放鑽石塊，蹲下右鍵設定速度"
  - "§f資訊顯示\n§7在站點 GUI 分別輸入上下站名稱"

tutorial.line.title: "§b§l建立路線"
tutorial.line.summary:
  - "§7連接多個站點"
  - "§7設定速度與環線"
tutorial.line.steps:
  - "§f建立路線\n§7在路線管理中建立，取得唯一 ID"
  - "§f加入站點\n§7按行駛順序排列站點 ID"
  - "§f設定速度\n§7預設 0.35，可依路線調整"
  - "§f環線模式\n§7最後一站的下一站會回到第一站"
  - "§f多線共用站點\n§7同一站點可屬於多條路線，搭車時會跳出選線"

tutorial.route.title: "§d§l錄製軌道"
tutorial.route.summary:
  - "§7讓導引沿正確路徑轉彎"
  - "§7管理員建線必做步驟"
tutorial.route.steps:
  - "§f為什麼要錄製？\n§7站點導引預設走站點間路徑；錄製後會沿實際軌道轉彎"
  - "§f開始錄製\n§7/train gui → 軌道錄製，或路線詳情 → 錄製軌道"
  - "§f召車錄製\n§7在起點站 §e右鍵§7 召喚原版礦車（錄製模式，非一般召車）"
  - "§f自行駕駛\n§7沿正確軌道開到下一站；到站停留 4 秒後自動進下一段"
  - "§f停止錄製\n§7GUI 內停止錄製，已完成路段會保留"
  - "§f建議\n§7岔路前確認走正確分支；轉彎處務必沿軌道駛過"

tutorial.ride.title: "§e§l乘車體驗"
tutorial.ride.summary:
  - "§7玩家如何搭車"
  - "§7站點導引與提示說明"
tutorial.ride.steps:
  - "§f召車上車\n§7站點鐵軌 §e一般右鍵§7 召喚礦車（§c勿蹲下§7），預設自動上車"
  - "§f站點導引\n§7站點須已加入路線；上車後先 §e停靠倒數§7，再自動發往下一站"
  - "§f行駛中\n§7畫面提示「發車 A → B（約 N 秒）」，§7不需玩家操作"
  - "§f到站\n§7顯示「已抵達 ○○站」，停留後繼續下一站"
  - "§f終點站\n§7提示「已抵達終點站」，請 §eShift §7下車"
  - "§f無路線時\n§7若站點未加入路線，無法啟動導引；請聯絡服主或改用手動駕駛"
  - "§f下車\n§7Shift 下車後，站內空礦車會自動消失"

