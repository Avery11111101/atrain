tutorial.advanced.title: "§5§l進階設定"
tutorial.advanced.summary:
  - "§7config.yml 調校"
  - "§7移動物理參數"
tutorial.advanced.steps:
  - "§fpath_guidance\n§7路徑導引開關，建議保持 true"
  - "§fguidance_strength\n§7糾偏強度 0~1，預設 0.65"
  - "§fstall_recovery\n§7失速恢復，沿軌道方向補速（非歷史方向）"
  - "§fobstruction_check\n§7前方有方塊時停止推力，防止回彈"
  - "§fhang_rail.enabled\n§7懸浮軌道，礦車沿鐵欄杆空中行駛"
  - "§f多語言\n§7/lang zh_TW 切換，語言檔在 plugins/atrain/lang/"

tutorial.hangrail.title: "§f§l懸浮軌道"
tutorial.hangrail.summary:
  - "§7空中軌道系統"
  - "§7基於 TC-HangRail"
tutorial.hangrail.steps:
  - "§f什麼是懸浮軌道？\n§7礦車懸掛在鐵欄杆(IRON_BARS)下方行駛，無需地面軌道"
  - "§f如何建造？\n§7水平放置鐵欄杆成線，在下方2格處用普通軌道導入"
  - "§f進入方式\n§7礦車從普通軌道駛向懸浮段時自動掛上"
  - "§f轉彎與斜坡\n§7支援直線、彎道、斜坡邏輯"
  - "§f開關設定\n§7GUI 主選單可切換，或 config.yml hang_rail.enabled"
  - "§f自訂方塊\n§7可在 config 新增其他方塊類型與偏移量"
