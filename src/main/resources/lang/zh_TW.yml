# ── 教學分類 ──
tutorial.quickstart.title: "§a§l快速開始"
tutorial.quickstart.summary:
  - "§75 分鐘上手"
  - "§7最精簡的入門流程"
tutorial.quickstart.steps:
  - "§f取得金斧選取工具\n§7手持金斧右鍵點擊兩個角落，框出停靠區域"
  - "§f建立站點\n§7/train gui → 站點管理 → 建立新站點"
  - "§f設定去程月台\n§7站在去程動力軌，站點詳情 → 設定去程月台"
  - "§f設定回程月台\n§7站在回程動力軌（反方向），設定回程月台"
  - "§f建立路線\n§7/train gui → 路線管理 → 建立新路線 → 去回程檢查"
  - "§f錄製軌道\n§7路線詳情 → 錄製軌道 → 搭車行駛 → /train stoprecord"
  - "§f開始營運\n§7玩家右鍵動力軌即可搭車！"

tutorial.stop.title: "§6§l建立站點"
tutorial.stop.summary:
  - "§7停靠區的完整設定"
  - "§7含角落選取與發車方向"
tutorial.stop.steps:
  - "§f什麼是停靠區？\n§7一個立體區域，礦車進入時觸發到站事件"
  - "§f選取角落\n§7金斧右鍵點擊對角兩點，形成包圍盒"
  - "§f停靠點\n§7一站兩軌：去程與回程各一條動力軌"
  - "§f去程月台\n§7玩家點去程軌道 → 沿路線順向行駛"
  - "§f回程月台\n§7玩家點回程軌道 → 沿路線逆向行駛"
  - "§f衝突檢查\n§7同一軌道但方向相反可運作，系統會建議分軌"
  - "§f注意事項\n§7停靠區不要重疊；發車方向應與軌道一致"

tutorial.line.title: "§b§l建立路線"
tutorial.line.summary:
  - "§7連接多個站點"
  - "§7設定速度與環線"
tutorial.line.steps:
  - "§f建立路線\n§7在路線管理中建立，取得唯一 ID"
  - "§f加入站點\n§7按行駛順序排列站點 ID"
  - "§f設定速度\n§7預設 0.35，可依路線調整"
  - "§f環線模式\n§7最後一站的下一站會回到第一站"
  - "§f多線共用站點\n§7同一站點可屬於多條路線，搭車時會跳出選線"

tutorial.route.title: "§d§l錄製軌道"
tutorial.route.summary:
  - "§7路徑導引的核心"
  - "§7修正飄線與轉彎問題"
tutorial.route.steps:
  - "§f為什麼要錄製？\n§7atrain 用軌跡點主動糾偏，防止礦車飄到別的路線"
  - "§f開始錄製\n§7路線詳情 → 錄製軌道，或 /train record <路線ID>"
  - "§f行駛錄製\n§7搭乘礦車沿正確路線完整行駛一遍"
  - "§f結束錄製\n§7/train stoprecord，軌跡點自動儲存"
  - "§f建議\n§7轉彎處多錄製、岔路前確保走正確分支"

tutorial.ride.title: "§e§l乘車體驗"
tutorial.ride.summary:
  - "§7玩家如何搭車"
  - "§7乘車中會看到什麼"
tutorial.ride.steps:
  - "§f如何搭車\n§7在站點區域內右鍵動力軌（紅石供電）"
  - "§f選擇路線\n§7若有多條路線經過，會跳出選線介面"
  - "§f行駛中\n§7系統自動導引，無需玩家操作"
  - "§f到站\n§7自動減速停靠，顯示到站訊息"
  - "§f下車\n§7Shift 下車，礦車會自動消失"

